# Declarative model/quantization matrix.
#
# Milestone 1 only: Qwen2.5-7B-Instruct in three configs (fp16, bnb-nf4,
# official AWQ). Add 14B/32B and GPTQ/3-bit entries here later -- src/ is
# meant to stay config-driven, so growing this file should be enough.
#
# `generation` is shared by every config below and must not be
# overridden per-model. Any config that needs to diverge from it (e.g. a
# quantization library forcing a dtype) must do so visibly in its own
# entry, never silently.

# temperature/top_p/top_k are no-ops under do_sample: false, but must
# still be pinned to HF's own greedy-neutral defaults (1.0/1.0/50) and
# applied explicitly (see load_model.apply_generation_config). Every
# Qwen2.5-Instruct checkpoint ships its own generation_config.json with
# sampling defaults (do_sample: true, temperature: 0.7, top_p: 0.8,
# top_k: 20) baked in, and transformers loads that from the checkpoint
# at from_pretrained time -- if this block isn't applied on top of it,
# every config silently runs sampling instead of greedy decoding, and
# fp16/AWQ/bnb configs can each diverge since AWQ is a separate upload
# with no guarantee its generation_config.json agrees with the base repo.
generation:
  do_sample: false
  temperature: 1.0
  top_p: 1.0
  top_k: 50
  max_new_tokens: 512

models:
  qwen2.5-7b-instruct-fp16:
    # NOTE: dtype is bfloat16, not float16, despite the "fp16" key/scheme
    # label -- Qwen2.5 was trained and is released in bf16, so bf16 is
    # the correct unquantized baseline. "fp16" is kept as this project's
    # established label for "the unquantized baseline" (see CLAUDE.md);
    # it is not a claim about the actual tensor dtype.
    base_model: Qwen/Qwen2.5-7B-Instruct
    scheme: fp16
    dtype: bfloat16
    quantization: null

  qwen2.5-7b-instruct-bnb-nf4:
    # Compute dtype stays float16, not bf16, so that comparisons against
    # the AWQ config (whose kernels are fp16-only, see below) aren't also
    # confounded by a dtype difference between the two quantized configs.
    base_model: Qwen/Qwen2.5-7B-Instruct
    scheme: bnb-nf4
    dtype: float16
    quantization:
      method: bitsandbytes
      load_in_4bit: true
      bnb_4bit_quant_type: nf4
      bnb_4bit_compute_dtype: float16
      bnb_4bit_use_double_quant: true

  qwen2.5-7b-instruct-awq:
    # Official Qwen pre-quantized checkpoint -- preferred over on-the-fly
    # quantization whenever one exists, per CLAUDE.md.
    # dtype is float16, not bf16: AutoAWQ's fused/exllama-style kernels
    # have historically been fp16-only, so bf16 here would risk a hard
    # failure or a silent kernel fallback rather than a clean comparison.
    base_model: Qwen/Qwen2.5-7B-Instruct-AWQ
    scheme: awq
    dtype: float16
    quantization:
      method: awq
